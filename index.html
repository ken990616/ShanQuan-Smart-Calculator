<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#851d25"><title>山泉鹽水雞｜價格計算</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#252525;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}header{background:#851d25;color:white;padding:22px 18px}header h1{margin:0;font-size:27px}header p{margin:6px 0 0;opacity:.85}.wrap{max-width:1050px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px;position:sticky;top:0;background:#f8f5ef;z-index:2}.tabs button{white-space:nowrap;background:white;color:#555;border:1px solid #ddd}.tabs button.active{background:#851d25;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.item{background:white;border:1px solid #e8e2da;border-radius:15px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:112px}.item strong{font-size:17px}.item footer{display:flex;align-items:center;justify-content:space-between;color:#9b252b;font-weight:750}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;font-weight:700;font-size:15px}.add{background:#f5e4e1;color:#851d25}.panel{background:white;border-radius:16px;padding:18px;margin-top:20px;border:1px solid #e8e2da}h2{font-size:21px;margin:0 0 15px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}label{display:block;font-weight:650}select{width:100%;margin-top:7px;padding:11px;border:1px solid #ddd;border-radius:9px;background:#fff;font-size:16px}.cartrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.cartrow .name{flex:1}.cartrow small{display:block;color:#777;margin-top:3px}.qty{display:flex;align-items:center;gap:9px}.qty button{padding:5px 10px;background:#f3efeb}.total{display:flex;justify-content:space-between;align-items:center;font-size:25px;font-weight:800;margin:20px 0}.total b{color:#9b252b}.actions{display:flex;gap:10px}.actions button{flex:1;background:#851d25;color:white}.actions button.secondary{background:#eee;color:#444}.empty{color:#777;padding:16px 0}.note{color:#777;font-size:13px;line-height:1.6;margin:14px 0 35px}@media(max-width:500px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cartrow{flex-wrap:wrap}.qty{margin-left:auto}}</style></head><body><header><div style="max-width:1050px;margin:auto"><h1>🐓 山泉鹽水雞</h1><p>SHAN QUAN｜點餐價格計算器</p></div></header><main class="wrap"><nav class="tabs" id="tabs"></nav><section><h2 id="heading"></h2><div class="grid" id="products"></div></section><section class="panel"><h2>🌶️ 口味選擇</h2><div class="options"><label>辣度<select id="spicy"><option>不辣</option><option>小辣</option><option>中辣</option><option>大辣</option></select></label><label>蔥<select id="onion"><option>要</option><option>不要</option></select></label><label>胡椒<select id="pepper"><option>胡椒少</option><option selected>正常</option><option>胡椒多</option></select></label></div></section><section class="panel"><h2>🧾 訂單明細</h2><div id="cart"><div class="empty">尚未選擇商品，請點選上方品項。</div></div><div class="total"><span>總金額</span><b id="total">NT$ 0</b></div><div class="actions"><button class="secondary" id="clear">清空訂單</button><button id="copy">複製訂單</button></div></section><p class="note">價格依提供的菜單照片建置；照片下緣未完整顯示的商品暫不收錄。套餐內容依菜單標示，若需自選配菜請向店家確認。所有資料只保存在本頁，重新整理後訂單會清空。</p></main><script>const catalog={"主餐":[["雞腿",90],["雞胸",90],["套餐 1（1腿＋3樣蔬菜）",125],["套餐 2（1胸＋3樣蔬菜）",125],["去骨（加價）",5]],"好料加點":[["雞生腸",20],["雞蛋黃",20],["雞屁股",20],["鴨腸",20],["雞冠",20],["雞皮",20],["雞胗",25],["雞心",25],["雞翅",15]],"蔬菜區":[["青花菜",20],["鮮脆筍",20],["高麗菜",20],["海帶芽",20],["豬耳朵",20],["甜不辣",20],["洋蔥",20],["豆皮",20],["米血",20],["木耳",20],["秋葵",20],["泡麵",20],["金針菇",20],["杏鮑菇",20],["玉米筍",20],["煙燻百頁",20],["德式香腸",20],["四季豆",20],["小黃瓜",20],["珊瑚藻",20],["紅蘿蔔",20],["白豆乾",20]]};let category='主餐';const cart=new Map();const tabs=document.getElementById('tabs'),products=document.getElementById('products');function renderProducts(){tabs.innerHTML='';Object.keys(catalog).forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c===category?'active':'';b.onclick=()=>{category=c;renderProducts()};tabs.append(b)});document.getElementById('heading').textContent=category;products.innerHTML='';catalog[category].forEach(([name,price])=>{let el=document.createElement('div');el.className='item';let title=document.createElement('strong');title.textContent=name;let foot=document.createElement('footer');let cost=document.createElement('span');cost.textContent=`NT$ ${price}`;let btn=document.createElement('button');btn.className='add';btn.textContent='＋ 加入';btn.onclick=()=>{cart.set(name,{price,qty:(cart.get(name)?.qty||0)+1});renderCart()};foot.append(cost,btn);el.append(title,foot);products.append(el)})}function renderCart(){const root=document.getElementById('cart');root.innerHTML='';let total=0;if(!cart.size){root.innerHTML='<div class="empty">尚未選擇商品，請點選上方品項。</div>'}for(const [name,{price,qty}] of cart){total+=price*qty;const line=document.createElement('div');line.className='cartrow';const info=document.createElement('div');info.className='name';const strong=document.createElement('strong');strong.textContent=name;const small=document.createElement('small');small.textContent=`NT$ ${price} × ${qty} = NT$ ${price*qty}`;info.append(strong,small);const controls=document.createElement('div');controls.className='qty';const minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label',`減少${name}`);minus.onclick=()=>change(name,-1);const num=document.createElement('span');num.textContent=qty;const plus=document.createElement('button');plus.textContent='＋';plus.setAttribute('aria-label',`增加${name}`);plus.onclick=()=>change(name,1);controls.append(minus,num,plus);line.append(info,controls);root.append(line)}document.getElementById('total').textContent=`NT$ ${total}`}function change(name,d){let item=cart.get(name);if(!item)return;item.qty+=d;if(item.qty<=0)cart.delete(name);renderCart()}document.getElementById('clear').onclick=()=>{if(cart.size&&confirm('確定清空整筆訂單？')){cart.clear();renderCart()}};document.getElementById('copy').onclick=async()=>{if(!cart.size){alert('請先加入商品');return}let rows=['山泉鹽水雞｜訂單',...Array.from(cart,([n,v])=>`${n} × ${v.qty}：NT$ ${v.qty*v.price}`),`辣度：${document.getElementById('spicy').value}`,`蔥：${document.getElementById('onion').value}`,`胡椒：${document.getElementById('pepper').value}`,`總計：${document.getElementById('total').textContent}`];let content=rows.join('\n');try{await navigator.clipboard.writeText(content);alert('已複製訂單')}catch{prompt('請複製以下訂單：',content)}};renderProducts();renderCart();</script></body></html>
