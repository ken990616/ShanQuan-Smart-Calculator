<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#851d25"><title>山泉鹽水雞｜價格計算</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#252525;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}header{background:#851d25;color:white;padding:22px 18px}header h1{margin:0;font-size:27px}header p{margin:6px 0 0;opacity:.85}.wrap{max-width:1050px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px;position:sticky;top:0;background:#f8f5ef;z-index:2}.tabs button{white-space:nowrap;background:white;color:#555;border:1px solid #ddd}.tabs button.active{background:#851d25;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.item{background:white;border:1px solid #e8e2da;border-radius:15px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:112px}.item strong{font-size:17px}.item footer{display:flex;align-items:center;justify-content:space-between;color:#9b252b;font-weight:750}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;font-weight:700;font-size:15px}.add{background:#f5e4e1;color:#851d25}.panel{background:white;border-radius:16px;padding:18px;margin-top:20px;border:1px solid #e8e2da}h2{font-size:21px;margin:0 0 15px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}label{display:block;font-weight:650}select{width:100%;margin-top:7px;padding:11px;border:1px solid #ddd;border-radius:9px;background:#fff;font-size:16px}.cartrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.cartrow .name{flex:1}.cartrow small{display:block;color:#777;margin-top:3px}.qty{display:flex;align-items:center;gap:9px}.qty button{padding:5px 10px;background:#f3efeb}.total{display:flex;justify-content:space-between;align-items:center;font-size:25px;font-weight:800;margin:20px 0}.total b{color:#9b252b}.actions{display:flex;gap:10px}.actions button{flex:1;background:#851d25;color:white}.actions button.secondary{background:#eee;color:#444}.empty{color:#777;padding:16px 0}.note{color:#777;font-size:13px;line-height:1.6;margin:14px 0 35px}@media(max-width:500px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cartrow{flex-wrap:wrap}.qty{margin-left:auto}}
/* 僅新增功能所需樣式，保留原有視覺 */
header .header-inner{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.login-btn{font-size:12px;padding:8px 10px;background:#fff;color:#851d25;white-space:nowrap}
.modal-backdrop{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-backdrop[hidden]{display:none}.modal{width:min(100%,510px);max-height:90dvh;overflow:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 12px 40px #0003}
.modal h2{margin-bottom:10px}.modal p{color:#666;font-size:14px}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions button{flex:1;background:#851d25;color:white}.modal-actions .secondary{background:#eee;color:#333}
.choice{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #e8e2da;border-radius:10px;margin:8px 0;font-weight:500}.choice input{accent-color:#851d25;width:18px;height:18px}
.side-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:230px;overflow:auto}.side-list .choice{margin:0;font-size:14px}
.admin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.admin-row button{font-size:13px;background:#f5e4e1;color:#851d25}
.soldout{opacity:.6}.soldout .add{background:#eee;color:#777;cursor:not-allowed}
.admin-tools{margin-top:14px}.admin-tools[hidden]{display:none}.password-input{width:100%;font-size:17px;padding:12px;border:1px solid #ddd;border-radius:9px}
@media(max-width:500px){.side-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><div class="header-inner"><div><h1>🐓 山泉鹽水雞</h1><p>SHAN QUAN｜點餐價格計算器</p></div><button class="login-btn" id="loginBtn" type="button">管理登入</button></div></header><main class="wrap"><nav class="tabs" id="tabs"></nav><section><h2 id="heading"></h2><div class="grid" id="products"></div></section><section class="panel"><h2>🌶️ 口味選擇</h2><div class="options"><label>辣度<select id="spicy"><option>不辣</option><option>微辣</option><option>小辣</option><option>中辣</option><option>大辣</option></select></label><label>蔥<select id="onion"><option>要</option><option>不要</option></select></label><label>胡椒<select id="pepper"><option>胡椒少</option><option selected>正常</option><option>胡椒多</option></select></label></div><div class="options" style="margin-top:12px"><label>📦 裝袋方式<select id="packaging"><option>袋裝</option><option>盒裝</option></select></label></div></section><section class="panel"><h2>🧾 訂單明細</h2><div id="cart"><div class="empty">尚未選擇商品，請點選上方品項。</div></div><div class="total"><span>總金額</span><b id="total">NT$ 0</b></div><div class="actions"><button class="secondary" id="clear">清空訂單</button><button id="copy">傳送至 LINE</button></div></section><p class="note">價格依提供的菜單照片建置；照片下緣未完整顯示的商品暫不收錄。套餐可自選三樣配菜。售完設定僅儲存在管理員目前使用的瀏覽器，不會跨裝置同步。所有資料只保存在本頁，重新整理後訂單會清空。</p></main><div class="modal-backdrop" id="dialog" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="modal-actions"><button class="secondary" id="cancelDialog" type="button">取消</button><button id="confirmDialog" type="button">確認</button></div></div></div><script>const catalog={"主餐":[["雞腿",90],["雞胸",90],["套餐 1（1腿＋3樣蔬菜）",125],["套餐 2（1胸＋3樣蔬菜）",125]],"好料加點":[["雞生腸",20],["雞蛋黃",20],["雞屁股",20],["鴨腸",20],["雞冠",20],["雞皮",20],["雞胗",25],["雞心",25],["雞翅",15]],"蔬菜區":[["青花菜",20],["鮮脆筍",20],["高麗菜",20],["海帶芽",20],["豬耳朵",20],["甜不辣",20],["洋蔥",20],["豆皮",20],["米血",20],["木耳",20],["秋葵",20],["泡麵",20],["金針菇",20],["杏鮑菇",20],["玉米筍",20],["煙燻百頁",20],["德式香腸",20],["四季豆",20],["小黃瓜",20],["珊瑚藻",20],["紅蘿蔔",20],["白豆乾",20],["龍鬚菜",20],["小鳥蛋",20]]};
let category='主餐';const cart=new Map();const tabs=document.getElementById('tabs'),products=document.getElementById('products');
const dialog=document.getElementById('dialog'),dialogTitle=document.getElementById('dialogTitle'),dialogBody=document.getElementById('dialogBody'),confirmDialog=document.getElementById('confirmDialog');
let admin=false,dialogConfirm=null;const storageKey='shanquan-soldout-v1';let soldOut={};try{soldOut=JSON.parse(localStorage.getItem(storageKey)||'{}')||{}}catch{soldOut={}}
function saveSoldOut(){try{localStorage.setItem(storageKey,JSON.stringify(soldOut))}catch{alert('瀏覽器無法儲存售完狀態')}}
function showDialog(title,body,confirmText,callback){dialogTitle.textContent=title;dialogBody.replaceChildren(body);confirmDialog.textContent=confirmText;dialogConfirm=callback;dialog.hidden=false}
function closeDialog(){dialog.hidden=true;dialogConfirm=null}document.getElementById('cancelDialog').onclick=closeDialog;confirmDialog.onclick=()=>{if(dialogConfirm)dialogConfirm()};dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.hidden)closeDialog()});
function addItem(name,price,detail=''){const key=JSON.stringify([name,detail,price]);const existing=cart.get(key);cart.set(key,{name,price,detail,qty:(existing?.qty||0)+1});renderCart()}
function beginAdd(name,price){if(soldOut[name])return;const isMeal=name.startsWith('套餐 ');const isMain=isMeal||name==='雞腿'||name==='雞胸';if(!isMain){addItem(name,price);return}
const body=document.createElement('div');const intro=document.createElement('p');intro.textContent=isMeal?'請選擇 3 樣配菜（可重複選同一品項）及是否去骨。':'請選擇是否去骨。';body.append(intro);
let selected=[];if(isMeal){const count=document.createElement('p');count.textContent='已選 0 / 3 樣';body.append(count);const list=document.createElement('div');list.className='side-list';for(const [side] of catalog['蔬菜區']){const row=document.createElement('label');row.className='choice';const input=document.createElement('input');input.type='checkbox';input.disabled=!!soldOut[side];const span=document.createElement('span');span.textContent=side+(soldOut[side]?'（售完）':'');row.append(input,span);list.append(row);input.addEventListener('change',()=>{if(input.checked){if(selected.length>=3){input.checked=false;alert('最多選擇三樣配菜');return}selected.push(side)}else{selected=selected.filter(s=>s!==side)}count.textContent=`已選 ${selected.length} / 3 樣`})}body.append(list);
const repeat=document.createElement('p');repeat.textContent='如需重複同一種配菜，請在下方補充選擇：';body.append(repeat);const repeatSelect=document.createElement('select');const emptyOption=document.createElement('option');emptyOption.value='';emptyOption.textContent='不重複選擇';repeatSelect.append(emptyOption);for(const [side] of catalog['蔬菜區']){if(soldOut[side])continue;const opt=document.createElement('option');opt.value=side;opt.textContent=side;repeatSelect.append(opt)}body.append(repeatSelect);const repeatBtn=document.createElement('button');repeatBtn.type='button';repeatBtn.className='add';repeatBtn.textContent='＋ 加入重複配菜';repeatBtn.style.marginTop='8px';repeatBtn.onclick=()=>{const side=repeatSelect.value;if(!side)return;if(selected.length>=3){alert('最多選擇三樣配菜');return}selected.push(side);count.textContent=`已選 ${selected.length} / 3 樣`;const detail=document.createElement('p');detail.textContent='已加入：'+side;body.insertBefore(detail,repeat);repeatSelect.value=''};body.append(repeatBtn)}
const boneLabel=document.createElement('label');boneLabel.className='choice';const bone=document.createElement('input');bone.type='checkbox';boneLabel.append(bone,document.createTextNode('去骨（＋NT$ 5）'));boneLabel.style.marginTop='15px';body.append(boneLabel);
showDialog(name,body,'確認加入',()=>{if(isMeal&&selected.length!==3){alert('套餐請選滿三樣配菜');return}if(soldOut[name]||(isMeal&&selected.some(s=>soldOut[s]))){alert('部分品項已售完，請重新選擇');closeDialog();return}const detail=[isMeal?'配菜：'+selected.join('、'):'',bone.checked?'去骨':'不去骨'].filter(Boolean).join('｜');addItem(name,price+(bone.checked?5:0),detail);closeDialog()})}
function renderProducts(){tabs.innerHTML='';Object.keys(catalog).forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c===category?'active':'';b.onclick=()=>{category=c;renderProducts()};tabs.append(b)});document.getElementById('heading').textContent=category;products.innerHTML='';catalog[category].forEach(([name,price])=>{let el=document.createElement('div');el.className='item';if(soldOut[name])el.classList.add('soldout');let title=document.createElement('strong');title.textContent=name;let foot=document.createElement('footer');let cost=document.createElement('span');cost.textContent=`NT$ ${price}`;let btn=document.createElement('button');btn.className='add';btn.textContent=soldOut[name]?'已售完':'＋ 加入';btn.disabled=!!soldOut[name];btn.onclick=()=>beginAdd(name,price);foot.append(cost,btn);el.append(title,foot);products.append(el)})}
function renderCart(){const root=document.getElementById('cart');root.innerHTML='';let total=0;if(!cart.size){root.innerHTML='<div class="empty">尚未選擇商品，請點選上方品項。</div>'}for(const [key,item] of cart){const {name,price,qty,detail}=item;total+=price*qty;const line=document.createElement('div');line.className='cartrow';const info=document.createElement('div');info.className='name';const strong=document.createElement('strong');strong.textContent=name;const small=document.createElement('small');small.textContent=(detail?detail+'｜':'')+`NT$ ${price} × ${qty} = NT$ ${price*qty}`;info.append(strong,small);const controls=document.createElement('div');controls.className='qty';const minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label',`減少${name}`);minus.onclick=()=>change(key,-1);const num=document.createElement('span');num.textContent=qty;const plus=document.createElement('button');plus.textContent='＋';plus.setAttribute('aria-label',`增加${name}`);plus.onclick=()=>change(key,1);controls.append(minus,num,plus);line.append(info,controls);root.append(line)}document.getElementById('total').textContent=`NT$ ${total}`}
function change(key,d){let item=cart.get(key);if(!item)return;if(d>0&&(soldOut[item.name]||(item.detail.startsWith('配菜：')&&item.detail.split('｜')[0].slice(3).split('、').some(s=>soldOut[s])))){alert('此品項目前已售完');return}item.qty+=d;if(item.qty<=0)cart.delete(key);renderCart()}
document.getElementById('clear').onclick=()=>{if(cart.size&&confirm('確定清空整筆訂單？')){cart.clear();renderCart()}};
document.getElementById('copy').onclick=()=>{if(!cart.size){alert('請先加入商品');return}let rows=['山泉鹽水雞｜訂單',...Array.from(cart.values(),v=>`${v.name}${v.detail?'（'+v.detail+'）':''} × ${v.qty}：NT$ ${v.qty*v.price}`),`辣度：${document.getElementById('spicy').value}`,`蔥：${document.getElementById('onion').value}`,`胡椒：${document.getElementById('pepper').value}`,`裝袋方式：${document.getElementById('packaging').value}`,`總計：${document.getElementById('total').textContent}`];const content=rows.join('\n');window.location.href='https://line.me/R/share?text='+encodeURIComponent(content)};
function showLogin(){const body=document.createElement('div');const p=document.createElement('p');p.textContent='請輸入管理員密碼';const input=document.createElement('input');input.className='password-input';input.type='password';input.placeholder='管理員密碼';input.autocomplete='off';body.append(p,input);showDialog('🔒 管理員登入',body,'登入',()=>{if(input.value!=='1021'){alert('密碼錯誤');return}admin=true;closeDialog();document.getElementById('loginBtn').textContent='管理設定';showAdmin()});input.addEventListener('keydown',e=>{if(e.key==='Enter')confirmDialog.click()});input.focus()}
function showAdmin(){if(!admin)return;const body=document.createElement('div');const note=document.createElement('p');note.textContent='售完設定僅儲存在此瀏覽器，不會同步其他手機或電腦。';body.append(note);for(const [group,items] of Object.entries(catalog)){const h=document.createElement('h3');h.textContent=group;body.append(h);for(const [name] of items){const row=document.createElement('div');row.className='admin-row';const label=document.createElement('span');label.textContent=name;const btn=document.createElement('button');const refresh=()=>{btn.textContent=soldOut[name]?'恢復供應':'設為售完'};refresh();btn.onclick=()=>{if(soldOut[name])delete soldOut[name];else soldOut[name]=true;saveSoldOut();refresh();renderProducts()};row.append(label,btn);body.append(row)}}const logout=document.createElement('button');logout.className='secondary';logout.textContent='登出管理員';logout.style.marginTop='16px';logout.onclick=()=>{admin=false;document.getElementById('loginBtn').textContent='管理登入';closeDialog()};body.append(logout);showDialog('⚙️ 商品售完管理',body,'完成',closeDialog)}
document.getElementById('loginBtn').onclick=()=>admin?showAdmin():showLogin();renderProducts();renderCart();</script></body></html>
