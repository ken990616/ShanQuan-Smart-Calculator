ht:800;margin:20px 0}.total b{color:#9b252b}.actions{display:flex;gap:10px}.actions button{flex:1;background:#851d25;color:white}.actions button.secondary{background:#eee;color:#444}.empty{color:#777;padding:16px 0}.note{color:#777;font-size:13px;line-height:1.6;margin:14px 0 35px}@media(max-width:500px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cartrow{flex-wrap:wrap}.qty{margin-left:auto}}

</style></head><body><header><div class="header-inner"><div><h1>🐓 山泉鹽水雞</h1><p>SHAN QUAN｜點餐價格計算器</p></div><button class="login-btn" id="loginBtn" type="button">管理登入</button></div></header><main class="wrap"><div class="hours-status" id="hoursStatus" aria-live="polite"></div><nav class="tabs" id="tabs"></nav><section><h2 id="heading"></h2><div class="grid" id="products"></div></section><section class="panel"><h2>🌶️ 口味選擇</h2><div class="options"><label>辣度<select id="spicy"><option>不辣</option><option>微辣</option><option>小辣</option><option>中辣</option><option>大辣</option></select></label><label>蔥<select id="onion"><option>要</option><option>不要</option></select></label><label>胡椒<select id="pepper"><option>胡椒少</option><option selected>正常</option><option>胡椒多</option></select></label></div><div class="options" style="margin-top:12px"><label>📦 裝袋方式<select id="packaging"><option>袋裝</option><option>盒裝</option></select></label></div></section><section class="panel"><h2>🧾 訂單明細</h2><div id="cart"><div class="empty">尚未選擇商品，請點選上方品項。</div></div><div class="total"><span>總金額</span><b id="total">NT$ 0</b></div><div class="order-note"><label for="orderNote">📝 整筆訂單備註（最多 100 字）</label><textarea id="orderNote" maxlength="100" rows="3" placeholder="例如：不要蒜頭、雞肉切小塊"></textarea><small id="noteCount">0 / 100 字</small></div><div class="actions"><button class="secondary" id="clear">清空訂單</button><button id="copy">傳送至 LINE</button></div></section><section class="panel"><h2>📋 點餐紀錄（保留 30 天）</h2><div id="orderHistory"></div></section><p class="note">價格依提供的菜單照片建置；照片下緣未完整顯示的商品暫不收錄。套餐可自選三樣配菜。週一至週六 17:00～23:30 營業，週日公休。管理員修改價格、營業時間及售完狀態後，須將設定發布到網站才會同步其他顧客。取餐號碼由各瀏覽器獨立編號，可能重複；LINE 分享不代表店家已收到訂單。</p></main><div class="modal-backdrop" id="dialog" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="modal-actions"><button class="secondary" id="cancelDialog" type="button">取消</button><button id="confirmDialog" type="button">確認</button></div></div></div><script src="config.js"></script><script>const catalog={"主餐":[["雞腿",90],["雞胸",90],["套餐 1（1腿＋3樣蔬菜）",125],["套餐 2（1胸＋3樣蔬菜）",125]],"好料加點":[["雞生腸",20],["雞蛋黃",20],["雞屁股",20],["鴨腸",20],["雞冠",20],["雞皮",20],["雞胗",25],["雞心",25],["雞翅",15]],"蔬菜區":[["青花菜",20],["鮮脆筍",20],["高麗菜",20],["海帶芽",20],["豬耳朵",20],["甜不辣",20],["洋蔥",20],["豆皮",20],["米血",20],["木耳",20],["秋葵",20],["泡麵",20],["金針菇",20],["杏鮑菇",20],["玉米筍",20],["煙燻百頁",20],["德式香腸",20],["四季豆",20],["小黃瓜",20],["珊瑚藻",20],["紅蘿蔔",20],["白豆乾",20],["龍鬚菜",20],["小鳥蛋",20]]};
const DEFAULT_HOURS={days:[1,2,3,4,5,6],open:'17:00',close:'23:30'};
const DEFAULT_CONFIG={hours:DEFAULT_HOURS,prices:{},soldOut:{},soldOutDate:''};
const CONFIG_KEY='shanquan-published-config-v2', DRAFT_KEY='shanquan-admin-draft-v2', HISTORY_KEY='shanquan-line-history-v2', SEQ_KEY='shanquan-line-sequence-v2';
function safeRead(key,fallback){try{return JSON.parse(localStorage.getItem(key)||'null')??fallback}catch{return fallback}}
function taiwanNow(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const obj=Object.fromEntries(parts.map(x=>[x.type,x.value]));return {date:`${obj.year}-${obj.month}-${obj.day}`,weekday:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(obj.weekday),minutes:Number(obj.hour)*60+Number(obj.minute)}}
function minutesOf(s){const m=/^(\d\d):(\d\d)$/.exec(s||'');return m?Number(m[1])*60+Number(m[2]):NaN}
function validHours(h){return h&&Array.isArray(h.days)&&h.days.every(d=>Number.isInteger(d)&&d>=0&&d<=6)&&Number.isFinite(minutesOf(h.open))&&Number.isFinite(minutesOf(h.close))&&minutesOf(h.open)<minutesOf(h.close)&&minutesOf(h.close)<=1439}
function sanitizeConfig(input){const cfg=structuredClone(DEFAULT_CONFIG);if(input&&validHours(input.hours))cfg.hours={days:[...new Set(input.hours.days)],open:input.hours.open,close:input.hours.close};for(const [group,items] of Object.entries(catalog)){for(const [name,price] of items){const n=input?.prices?.[name];if(Number.isInteger(n)&&n>=0&&n<=100000)cfg.prices[name]=n}}const bone=input?.prices?.['去骨加價'];if(Number.isInteger(bone)&&bone>=0&&bone<=100000)cfg.prices['去骨加價']=bone;if(input?.soldOut&&typeof input.soldOut==='object')for(const items of Object.values(catalog))for(const [name] of items)if(input.soldOut[name]===true)cfg.soldOut[name]=true;if(/^\d{4}-\d{2}-\d{2}$/.test(input?.soldOutDate||''))cfg.soldOutDate=input.soldOutDate;return cfg}
let published=sanitizeConfig(window.SHANQUAN_PUBLISHED_CONFIG||safeRead(CONFIG_KEY,DEFAULT_CONFIG));const locallyUpdated=safeRead(CONFIG_KEY,null);if(locallyUpdated&&locallyUpdated.soldOutDate===taiwanNow().date){published.soldOut=sanitizeConfig(locallyUpdated).soldOut;published.soldOutDate=locallyUpdated.soldOutDate}
let draft=sanitizeConfig(safeRead(DRAFT_KEY,published));
function saveDraft(){localStorage.setItem(DRAFT_KEY,JSON.stringify(draft))}
function currentPrice(name,base){return Number.isInteger(published.prices[name])?published.prices[name]:base}
function businessState(){const n=taiwanNow(),h=published.hours,open=minutesOf(h.open),close=minutesOf(h.close);return {open:h.days.includes(n.weekday)&&n.minutes>=open&&n.minutes<close,firstOpening:h.days.includes(n.weekday)&&n.minutes>=open,date:n.date}}
function syncDailySoldOut(){const b=businessState();if(b.firstOpening&&published.soldOutDate!==b.date){published.soldOut={};published.soldOutDate=b.date;soldOut=published.soldOut;localStorage.setItem(CONFIG_KEY,JSON.stringify(published));if(admin){draft.soldOut={};draft.soldOutDate=b.date;saveDraft()}}}
function updateHoursUI(){syncDailySoldOut();const s=businessState(),el=document.getElementById('hoursStatus');el.classList.toggle('closed',!s.open);el.innerHTML=s.open?'<strong>🟢 營業中</strong>｜目前開放 LINE 分享點餐':'<strong>🟠 目前休息中</strong>｜可瀏覽菜單，營業時間才可傳送 LINE 訂單';document.getElementById('copy').disabled=!s.open}
function getHistory(){const now=Date.now();const list=safeRead(HISTORY_KEY,[]);const filtered=Array.isArray(list)?list.filter(o=>Number.isFinite(o.createdAt)&&now-o.createdAt<30*86400000&&now>=o.createdAt):[];if(filtered.length!==list.length)localStorage.setItem(HISTORY_KEY,JSON.stringify(filtered));return filtered}
function renderHistory(){const root=document.getElementById('orderHistory'),items=getHistory();root.replaceChildren();if(!items.length){root.textContent='尚無最近 30 天的 LINE 分享訂單紀錄。';return}for(const o of items.slice().reverse()){const details=document.createElement('details');details.className='history-item';const summary=document.createElement('summary');summary.textContent=`${o.number}｜${new Date(o.createdAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})}｜NT$ ${o.total}`;const status=document.createElement('p');status.textContent='已建立 LINE 分享訂單（無法確認店家是否收到）';const pre=document.createElement('pre');pre.textContent=o.content;details.append(summary,status,pre);root.append(details)}}
function nextTicket(){const today=taiwanNow().date;const last=safeRead(SEQ_KEY,{date:'',number:0});const n=last.date===today?last.number+1:1;localStorage.setItem(SEQ_KEY,JSON.stringify({date:today,number:n}));return 'A'+String(n).padStart(3,'0')}
function orderTotal(){return Array.from(cart.values()).reduce((s,x)=>s+x.qty*x.price,0)}
function hasUnavailable(){return Array.from(cart.values()).some(item=>published.soldOut[item.name]||(item.detail.startsWith('配菜：')&&item.detail.split('｜')[0].slice(3).split('、').some(s=>published.soldOut[s])))}
let category='主餐';const cart=new Map();const tabs=document.getElementById('tabs'),products=document.getElementById('products');
const dialog=document.getElementById('dialog'),dialogTitle=document.getElementById('dialogTitle'),dialogBody=document.getElementById('dialogBody'),confirmDialog=document.getElementById('confirmDialog');
let admin=false,dialogConfirm=null;let soldOut=published.soldOut;
function saveSoldOut(){published.soldOut=soldOut;localStorage.setItem(CONFIG_KEY,JSON.stringify(published));draft.soldOut={...soldOut};saveDraft()}
function showDialog(title,body,confirmText,callback){dialogTitle.textContent=title;dialogBody.replaceChildren(body);confirmDialog.textContent=confirmText;dialogConfirm=callback;dialog.hidden=false}
function closeDialog(){dialog.hidden=true;dialogConfirm=null}document.getElementById('cancelDialog').onclick=closeDialog;confirmDialog.onclick=()=>{if(dialogConfirm)dialogConfirm()};dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.hidden)closeDialog()});
let sqToastTimer;function showAddedToast(){const toast=document.getElementById('sq-added-toast');clearTimeout(sqToastTimer);toast.classList.add('visible');sqToastTimer=setTimeout(()=>toast.classList.remove('visible'),2000)}
function addItem(name,price,detail=''){const key=JSON.stringify([name,detail,price]);const existing=cart.get(key);cart.set(key,{name,price,detail,qty:(existing?.qty||0)+1});renderCart();showAddedToast()}
function beginAdd(name,price){price=currentPrice(name,price);if(soldOut[name])return;const isMeal=name.startsWith('套餐 ');const isMain=isMeal||name==='雞腿'||name==='雞胸';if(!isMain){addItem(name,price);return}
const body=document.createElement('div');const intro=document.createElement('p');intro.textContent=isMeal?'請選擇 3 樣配菜（可重複選同一品項）及是否去骨。':'請選擇是否去骨。';body.append(intro);
let selected=[];if(isMeal){const count=document.createElement('p');count.textContent='已選 0 / 3 樣';body.append(count);const list=document.createElement('div');list.className='side-list';for(const [side] of catalog['蔬菜區']){const row=document.createElement('label');row.className='choice';const input=document.createElement('input');input.type='checkbox';input.disabled=!!soldOut[side];const span=document.createElement('span');span.textContent=side+(soldOut[side]?'（售完）':'');row.append(input,span);list.append(row);input.addEventListener('change',()=>{if(input.checked){if(selected.length>=3){input.checked=false;alert('最多選擇三樣配菜');return}selected.push(side)}else{selected=selected.filter(s=>s!==side)}count.textContent=`已選 ${selected.length} / 3 樣`})}body.append(list);
const repeat=document.createElement('p');repeat.textContent='如需重複同一種配菜，請在下方補充選擇：';body.append(repeat);const repeatSelect=document.createElement('select');const emptyOption=document.createElement('option');emptyOption.value='';emptyOption.textContent='不重複選擇';repeatSelect.append(emptyOption);for(const [side] of catalog['蔬菜區']){if(soldOut[side])continue;const opt=document.createElement('option');opt.value=side;opt.textContent=side;repeatSelect.append(opt)}body.append(repeatSelect);const repeatBtn=document.createElement('button');repeatBtn.type='button';repeatBtn.className='add';repeatBtn.textContent='＋ 加入重複配菜';repeatBtn.style.marginTop='8px';repeatBtn.onclick=()=>{const side=repeatSelect.value;if(!side)return;if(selected.length>=3){alert('最多選擇三樣配菜');return}selected.push(side);count.textContent=`已選 ${selected.length} / 3 樣`;const detail=document.createElement('p');detail.textContent='已加入：'+side;body.insertBefore(detail,repeat);repeatSelect.value=''};body.append(repeatBtn)}
const boneLabel=document.createElement('label');boneLabel.className='choice';const bone=document.createElement('input');bone.type='checkbox';boneLabel.append(bone,document.createTextNode('去骨（＋NT$ '+currentPrice('去骨加價',5)+'）'));boneLabel.style.marginTop='15px';body.append(boneLabel);
showDialog(name,body,'確認加入',()=>{if(isMeal&&selected.length!==3){alert('套餐請選滿三樣配菜');return}if(soldOut[name]||(isMeal&&selected.some(s=>soldOut[s]))){alert('部分品項已售完，請重新選擇');closeDialog();return}const detail=[isMeal?'配菜：'+selected.join('、'):'',bone.checked?'去骨':'不去骨'].filter(Boolean).join('｜');addItem(name,price+(bone.checked?currentPrice('去骨加價',5):0),detail);closeDialog()})}
function renderProducts(){tabs.innerHTML='';Object.keys(catalog).forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c===category?'active':'';b.onclick=()=>{category=c;renderProducts()};tabs.append(b)});document.getElementById('heading').textContent=category;products.innerHTML='';catalog[category].forEach(([name,price])=>{let el=document.createElement('div');el.className='item';if(soldOut[name])el.classList.add('soldout');let title=document.createElement('strong');title.textContent=name;let foot=document.createElement('footer');let cost=document.createElement('span');cost.textContent=`NT$ ${currentPrice(name,price)}`;let btn=document.createElement('button');btn.className='add';btn.textContent=soldOut[name]?'已售完':'＋ 加入';btn.disabled=!!soldOut[name];btn.onclick=()=>beginAdd(name,price);foot.append(cost,btn);el.append(title,foot);products.append(el)})}
function renderCart(){const root=document.getElementById('cart');root.innerHTML='';let total=0;if(!cart.size){root.innerHTML='<div class="empty">尚未選擇商品，請點選上方品項。</div>'}for(const [key,item] of cart){const {name,price,qty,detail}=item;total+=price*qty;const line=document.createElement('div');line.className='cartrow';const info=document.createElement('div');info.className='name';const strong=document.createElement('strong');strong.textContent=name;const small=document.createElement('small');small.textContent=(detail?detail+'｜':'')+`NT$ ${price} × ${qty} = NT$ ${price*qty}`;info.append(strong,small);const controls=document.createElement('div');controls.className='qty';const minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label',`減少${name}`);minus.onclick=()=>change(key,-1);const num=document.createElement('span');num.textContent=qty;const plus=document.createElement('button');plus.textContent='＋';plus.setAttribute('aria-label',`增加${name}`);plus.onclick=()=>change(key,1);controls.append(minus,num,plus);line.append(info,controls);root.append(line)}document.getElementById('total').textContent=`NT$ ${total}`}
function change(key,d){let item=cart.get(key);if(!item)return;if(d>0&&(soldOut[item.name]||(item.detail.startsWith('配菜：')&&item.detail.split('｜')[0].slice(3).split('、').some(s=>soldOut[s])))){alert('此品項目前已售完');return}item.qty+=d;if(item.qty<=0)cart.delete(key);renderCart()}
document.getElementById('clear').onclick=()=>{if(cart.size&&confirm('確定清空整筆訂單？')){cart.clear();renderCart()}};
document.getElementById('orderNote').addEventListener('input',e=>{document.getElementById('noteCount').textContent=e.target.value.length+' / 100 字'});
document.getElementById('copy').onclick=()=>{updateHoursUI();if(!businessState().open){alert('目前非營業時間，請於週一至週六 17:00～23:30 送單');return}if(!cart.size){alert('請先加入商品');return}if(hasUnavailable()){alert('購物車含有已售完商品，請先調整');return}
const number=nextTicket(),note=document.getElementById('orderNote').value.trim().slice(0,100),total=orderTotal();
const rows=['山泉鹽水雞｜LINE 分享訂單',`取餐號碼：${number}`,...Array.from(cart.values(),v=>`${v.name}${v.detail?'（'+v.detail+'）':''} × ${v.qty}：NT$ ${v.qty*v.price}`),`辣度：${document.getElementById('spicy').value}`,`蔥：${document.getElementById('onion').value}`,`胡椒：${document.getElementById('pepper').value}`,`裝袋方式：${document.getElementById('packaging').value}`,`備註：${note||'無'}`,`總計：NT$ ${total}`];const content=rows.join('\n');

const priceTitle=document.createElement('h3');priceTitle.textContent='💰 商品價格設定';body.append(priceTitle);

const bone=document.createElement('label');bone.textContent='去骨加價 NT$';const boneInput=document.createElement('input');boneInput.type='number';boneInput.className='admin-price';boneInput.min='0';boneInput.step='1';boneInput.value=draft.prices['去骨加價']??5;boneInput.onchange=()=>{const n=Number(boneInput.value);if(Number.isInteger(n)&&n>=0&&n<=100000){draft.prices['去骨加價']=n;saveDraft()}else alert('請輸入有效價格')};bone.append(boneInput);body.append(bone);

const exportBtn=document.createElement('button');exportBtn.className='secondary';exportBtn.style.margin='12px 0 0 8px';exportBtn.textContent='下載 config.js（供網站發布）';exportBtn.onclick=()=>{if(!validHours(draft.hours)){alert('營業時間設定有誤');return}const cfg=sanitizeConfig(draft);const content='window.SHANQUAN_PUBLISHED_CONFIG = '+JSON.stringify(cfg,null,2)+';\n';const blob=new Blob([content],{type:'text/javascript;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='config.js';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};body.append(exportBtn);
